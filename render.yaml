services:
  - type: web
    name: driving-theory-app
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID_FULL_ACCESS
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      # Temporary content pause. Set true to disable Practice/Mock/purchases.
      # Phase 5A: V2 758-question bank is live. Keep false unless an explicit
      # content pause is required. Existing accounts/purchases are unaffected.
      - key: CONTENT_MAINTENANCE_MODE
        value: "false"
      # Phase 5C: keep false until 0009 is applied in an approved window.
      # Production never uses gitignored local JSON for cards.
      - key: LEARNING_CARDS_USE_SUPABASE
        value: "false"

